titre: Stratégies face à l'IA dans les métiers du logiciel et de la donnée
introduction: Ces six stratégies décrivent des paris possibles pour les développeurs et développeuses, data scientists, data engineers et AI engineers. Elles ne sont ni exclusives ni des prédictions. Les portraits associés illustrent différentes façons de tenir un même pari, parfois avec des motivations opposées.

strategies:
  - id: maintenir_le_cap
    nom: Maintenir le cap
    pari: Mon positionnement actuel reste suffisamment viable pour que continuer à l'exercer soit préférable à une réorientation immédiate.
    actions: Poursuivre son travail et son apprentissage, en décidant explicitement quels changements du marché justifieraient une adaptation.
    conditions_reussite:
      - Les compétences et les résultats produits restent demandés dans les postes visés.
      - La personne peut réévaluer sa position sans attendre d'y être contrainte.
    avantages:
      - Préserve une pratique technique directe et évite de courir après chaque nouveauté.
      - Laisse du temps pour observer quels usages de l'IA créent réellement de la valeur.
    limites:
      - Les attentes des employeurs peuvent évoluer avant qu'un changement de poste ne rende ce décalage visible.
      - Augmenter son effort sans améliorer sa valeur par heure travaillée peut conduire à l'épuisement.
    signaux_revision:
      - Les postes visés demandent des capacités que la pratique actuelle ne permet plus de démontrer.
      - La charge de travail augmente durablement sans amélioration correspondante des résultats ou des perspectives.
    portraits:
      - id: autruche
        nom: L'autruche
        nuance: Évite de regarder les changements, parfois en pariant que la bulle IA éclatera. Le risque spécifique est de ne pas remarquer à temps que les attentes ont changé.
      - id: bourrin
        nom: Le bourrin
        nuance: Compense la pression par davantage d'effort, avec ou sans IA. Ce levier peut aider ponctuellement, mais sa soutenabilité est limitée.
    precision: Maintenir le cap peut aussi être un choix informé et révisable, sans évitement ni surtravail.

  - id: accroitre_sa_capacite
    nom: Augmenter sa capacité de production
    pari: L'IA me permet de réaliser plus de choses ou des choses auparavant hors de portée, et je peux convertir ce gain en valeur pour moi.
    actions: Intégrer l'IA à son travail, mesurer ce qu'elle permet réellement de livrer et négocier ou choisir l'usage du temps et de la valeur ainsi gagnés.
    conditions_reussite:
      - Les gains restent réels après vérification, intégration et maintenance du travail produit.
      - Une partie des gains revient à la personne sous forme de revenu, d'autonomie, de temps ou d'apprentissage.
    avantages:
      - Permet d'élargir le périmètre des projets accessibles et d'expérimenter rapidement.
      - Peut accroître le plaisir de créer et libérer du temps pour des tâches plus importantes.
    limites:
      - Un gain accessible à tous peut devenir une nouvelle exigence sans améliorer la position individuelle.
      - Produire plus peut accroître la dette technique ou la charge de vérification si la qualité ne suit pas.
    signaux_revision:
      - Le volume livré augmente mais les résultats utiles ou la qualité stagnent.
      - Les attentes augmentent sans gain de rémunération, d'autonomie ou de temps.
    portraits:
      - id: emerveille
        nom: L'émerveillé
        nuance: Adopte les outils avec enthousiasme. Cet enthousiasme facilite l'exploration, mais ne dit pas à lui seul qui bénéficie des gains.

  - id: se_differencier_techniquement
    nom: Se différencier techniquement
    pari: Une capacité rare ou une fiabilité démontrable reste assez précieuse pour justifier qu'on me confie certains problèmes.
    actions: Choisir des problèmes dont la résolution ou l'échec ont un coût identifiable, puis rendre visible la qualité de la contribution apportée.
    conditions_reussite:
      - Il existe une demande solvable pour la compétence ou le niveau de fiabilité proposés.
      - La valeur reste démontrable même lorsque l'IA facilite une partie du travail.
    avantages:
      - Capitalise sur l'expérience technique et l'apprentissage continu.
      - Peut associer outils IA, jugement technique et responsabilité sur le résultat.
    limites:
      - Une niche étroite peut perdre de sa valeur si les besoins ou les outils changent.
      - Une exigence de qualité que personne ne peut observer ou n'est prêt à payer ne suffit pas à se différencier.
    signaux_revision:
      - Les problèmes visés deviennent faciles à résoudre et à vérifier par des alternatives moins coûteuses.
      - Les clients ou employeurs ne reconnaissent plus la différence de résultat.
    portraits:
      - id: specialiste
        nom: Le spécialiste
        nuance: Mise sur la maîtrise de problèmes difficiles dans un domaine précis. Le pari porte sur la résolution de ces problèmes, pas seulement sur le fait d'en savoir plus que l'IA.
      - id: artisan
        nom: L'artisan
        nuance: Mise sur la fiabilité, la sécurité et la maintenabilité des livrables, qu'il s'agisse de code, de pipelines, de données ou de modèles. Sa différence doit se traduire en incidents évités ou en coûts et risques réduits, quel que soit son outillage.

  - id: deplacer_sa_contribution
    nom: Déplacer sa contribution
    pari: Ma valeur se situe davantage dans le choix des problèmes, la coordination ou la transmission que dans la seule réalisation technique directe.
    actions: Développer une légitimité auprès des utilisateurs et des équipes, puis exercer une responsabilité réelle sur les décisions, l'organisation ou la montée en compétence.
    conditions_reussite:
      - Les organisations accordent une place et des moyens à ces responsabilités.
      - La personne acquiert des compétences métier, relationnelles ou pédagogiques qui ne découlent pas automatiquement de son parcours technique.
    avantages:
      - Rapproche du contexte d'usage, des arbitrages et des décisions à fort impact.
      - Peut démultiplier la contribution d'autres personnes plutôt que la seule production individuelle.
    limites:
      - Certaines tâches de coordination, de formalisation ou de formation peuvent aussi être facilitées par l'IA.
      - Quitter la pratique directe peut affaiblir la crédibilité si le lien avec le terrain disparaît.
    signaux_revision:
      - Le rôle se réduit à transmettre des demandes sans pouvoir réel sur les décisions.
      - L'organisation n'accorde pas de valeur durable à la responsabilité exercée.
    portraits:
      - id: fonctionnel
        nom: Le fonctionnel
        nuance: Cherche à comprendre les besoins, choisir quoi construire et arbitrer pourquoi. La connaissance métier et l'accès aux utilisateurs comptent davantage que la seule créativité.
      - id: manager
        nom: Le manager
        nuance: Coordonne des personnes, prend des décisions et assume leurs conséquences. Piloter des agents ne remplace pas automatiquement cette responsabilité humaine.
      - id: passeur
        nom: Le passeur
        nuance: Aide d'autres personnes à adopter de nouvelles pratiques. L'accompagnement du changement peut durer plus longtemps que la simple initiation à un outil.

  - id: changer_de_marche
    nom: Changer de marché professionnel
    pari: Un autre métier ou secteur offre un meilleur avenir compte tenu de mes contraintes, de mes compétences transférables et de mes aspirations.
    actions: Explorer des débouchés concrets, tester un nouveau travail à petite échelle et préparer le financement de la transition.
    conditions_reussite:
      - Une demande existe pour le nouveau métier aux conditions de travail et de revenu recherchées.
      - Le temps, les ressources et les compétences transférables permettent d'effectuer la transition.
    avantages:
      - Permet de choisir sa trajectoire avant d'être contraint par une dégradation de sa situation.
      - Peut réemployer une partie des compétences acquises dans un autre contexte.
    limites:
      - Apprendre un autre métier a un coût et ne garantit pas un meilleur marché.
      - Une transition peut nécessiter des ressources financières ou un revenu intermédiaire.
    signaux_revision:
      - Les débouchés constatés ne correspondent pas aux attentes initiales.
      - La transition exige plus de temps ou de ressources que prévu.
    portraits:
      - id: reconverti
        nom: Le reconverti
        nuance: Quitte volontairement les métiers techniques du logiciel ou de la donnée pour réinvestir ailleurs. Vivre d'une rente relève d'un choix patrimonial différent, pas de cette stratégie professionnelle.

  - id: agir_collectivement
    nom: Agir collectivement
    pari: Les conditions d'emploi et le partage des gains de l'IA peuvent être modifiés par l'organisation des travailleurs et la négociation des règles.
    actions: Se regrouper pour négocier les déploiements, la charge de travail, la formation, les rémunérations et, si nécessaire, agir sur les règles du secteur.
    conditions_reussite:
      - Des personnes concernées peuvent se coordonner autour de demandes précises.
      - Elles disposent d'un rapport de force ou d'interlocuteurs capables de faire appliquer des accords.
    avantages:
      - Agit sur des décisions que l'adaptation individuelle ne peut pas modifier seule.
      - Les résultats peuvent bénéficier à davantage de personnes que les seuls participants.
    limites:
      - La mobilisation et la négociation demandent du temps, avec des résultats incertains.
      - Les avancées dans une entreprise ne suffisent pas toujours à changer la dynamique du marché entier.
    signaux_revision:
      - Les revendications restent trop diffuses pour déboucher sur un accord vérifiable.
      - Les accords obtenus ne sont pas appliqués ou n'améliorent pas les conditions visées.
    portraits:
      - id: syndicaliste
        nom: Le syndicaliste
        nuance: Organise une réponse collective, de la négociation dans l'entreprise à l'action sectorielle ou réglementaire. Ces échelles n'ont pas les mêmes délais.

logiques_transversales:
  - id: monetiser_une_fenetre
    nom: Monétiser une fenêtre d'opportunité
    portrait_origine: mercenaire_996
    pari: Accepter temporairement une intensité plus forte pour capter une rémunération exceptionnelle ou construire une marge de manœuvre future.
    applicable_a: Peut accompagner plusieurs stratégies, notamment la production augmentée ou la différenciation technique.
    conditions_reussite:
      - Le gain financier est réel et revient à la personne qui fournit l'effort.
      - La durée, le bénéfice recherché et les critères de sortie sont définis à l'avance.
    limite: Le « 996 » illustre le surinvestissement, pas une nécessité ni une recommandation. Son coût personnel peut dépasser les gains attendus.
