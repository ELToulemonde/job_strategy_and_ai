version: 4
titre: Quelles sont mes orientations professionnelles à l'ère de l'IA ?
consigne: Répondez en pensant à vos priorités pour les six prochains mois. Plusieurs stratégies peuvent compter pour vous à la fois. Il n'y a pas de bonne réponse.
duree_estimee: 4 à 5 minutes
strategies_source: strategies-ia-emploi-dev.yaml
axes:
  - maintenir_le_cap
  - accroitre_sa_capacite
  - se_differencier_techniquement
  - deplacer_sa_contribution
  - changer_de_marche
  - agir_collectivement

affirmations:
  echelle:
    - {valeur: 1, libelle: "1"}
    - {valeur: 2, libelle: "2"}
    - {valeur: 3, libelle: "3"}
    - {valeur: 4, libelle: "4"}
    - {valeur: 5, libelle: "5"}
  borne_basse: Pas du tout une priorité
  borne_haute: Priorité très forte
  reponse_incertaine: Je ne sais pas encore

situations:
  maximum_choix: 1
  consigne: Choisissez la piste que vous privilégieriez. « Aucune » et « Je ne sais pas encore » sont aussi possibles.
  reponses_speciales:
    aucune:
      libelle: Aucune de ces pistes ne me correspond
      contribution: 0
      exclusive: true
    incertain:
      libelle: Je ne sais pas encore
      contribution: null
      exclusive: true

calcul:
  poids_affirmation: 0.5
  poids_situations: 0.5
  points_par_option_et_axe: 1
  plafond_par_situation_et_axe: 1
  valeur_manquante: null
  arrondi_affichage_decimales: 1

questions:
  - id: q01
    type: affirmation
    axe: maintenir_le_cap
    texte: Continuer dans mon type de rôle actuel, sans réorientation majeure, est une priorité pour moi.

  - id: q02
    type: affirmation
    axe: accroitre_sa_capacite
    texte: Utiliser l'IA pour élargir ce que je peux réaliser professionnellement est une priorité pour moi.

  - id: q03
    type: affirmation
    axe: se_differencier_techniquement
    texte: Construire une valeur professionnelle distinctive grâce à mes compétences techniques est une priorité pour moi.

  - id: q04
    type: affirmation
    axe: deplacer_sa_contribution
    texte: Faire évoluer mon rôle au-delà de la réalisation technique directe est une priorité pour moi.

  - id: q05
    type: affirmation
    axe: changer_de_marche
    texte: Préparer une activité professionnelle en dehors des métiers techniques du logiciel, de la donnée et de l'IA est une priorité pour moi.

  - id: q06
    type: affirmation
    axe: agir_collectivement
    texte: Agir avec d'autres personnes sur les conditions de travail liées à l'IA est une priorité pour moi.

  - id: q07
    type: situation
    texte: Vous pouvez réserver une demi-journée par semaine à votre avenir professionnel. À quoi la consacrez-vous ?
    options:
      - id: a
        texte: Consolider ma pratique actuelle et regarder si elle répond toujours aux attentes du marché.
        axes: [maintenir_le_cap]
      - id: b
        texte: Tester un usage de l'IA qui me permettrait de prendre en charge de nouveaux travaux.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Approfondir un problème technique difficile, en utilisant l'IA si elle m'aide à le résoudre.
        axes: [se_differencier_techniquement, accroitre_sa_capacite]
      - id: d
        texte: Discuter avec des utilisateurs pour mieux comprendre quels problèmes méritent d'être résolus.
        axes: [deplacer_sa_contribution]

  - id: q08
    type: situation
    texte: Vous choisissez un projet personnel à mener au cours des prochains mois. Lequel privilégiez-vous ?
    options:
      - id: a
        texte: Mettre à jour et approfondir une compétence technique utile à mon rôle actuel.
        axes: [maintenir_le_cap, se_differencier_techniquement]
      - id: b
        texte: Construire avec l'IA quelque chose que je ne pourrais pas réaliser seul aujourd'hui.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Tester concrètement une activité dans un autre métier.
        axes: [changer_de_marche]
      - id: d
        texte: Préparer avec des collègues des propositions sur les conditions de déploiement de l'IA.
        axes: [agir_collectivement]

  - id: q09
    type: situation
    texte: Votre équipe envisage d'utiliser davantage l'IA dans son travail technique. Que feriez-vous en premier ?
    options:
      - id: a
        texte: Vérifier la fiabilité du travail produit avec l'IA dans mon rôle actuel.
        axes: [se_differencier_techniquement, maintenir_le_cap]
      - id: b
        texte: Tester les usages utiles, puis aider l'équipe à les mettre en place.
        axes: [deplacer_sa_contribution, accroitre_sa_capacite]
      - id: c
        texte: Explorer concrètement une voie professionnelle hors des métiers techniques du logiciel et de la donnée.
        axes: [changer_de_marche]
      - id: d
        texte: Discuter avec les collègues pour négocier les règles d'usage et la charge de travail.
        axes: [agir_collectivement]

  - id: q10
    type: situation
    texte: Une mission proche de votre activité actuelle se présente. Qu'est-ce qui vous donnerait le plus envie de la choisir ?
    options:
      - id: a
        texte: Elle permet de poursuivre mon travail dans un cadre que je connais bien.
        axes: [maintenir_le_cap]
      - id: b
        texte: Elle me permet de livrer un périmètre plus large grâce à l'IA.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Elle comporte des problèmes techniques difficiles que je peux résoudre et vérifier.
        axes: [se_differencier_techniquement]
      - id: d
        texte: Elle me donne une responsabilité sur les besoins métier et les choix du projet.
        axes: [deplacer_sa_contribution]

  - id: q11
    type: situation
    texte: Vous avez une journée de formation à utiliser librement. Quel apprentissage choisiriez-vous ?
    options:
      - id: a
        texte: Approfondir un domaine technique utile à mon rôle actuel.
        axes: [maintenir_le_cap, se_differencier_techniquement]
      - id: b
        texte: Apprendre à utiliser l'IA pour aider mes collègues à élargir ce qu'ils peuvent réaliser.
        axes: [accroitre_sa_capacite, deplacer_sa_contribution]
      - id: c
        texte: Découvrir les compétences nécessaires pour exercer un autre métier.
        axes: [changer_de_marche]
      - id: d
        texte: Apprendre à organiser une négociation collective sur les effets de l'IA au travail.
        axes: [agir_collectivement]

  - id: q12
    type: situation
    texte: Un réseau professionnel organise des échanges sur l'évolution des métiers avec l'IA. Qu'y feriez-vous en priorité ?
    options:
      - id: a
        texte: Évaluer la qualité et la fiabilité des résultats produits.
        axes: [se_differencier_techniquement]
      - id: b
        texte: Faciliter les échanges entre les équipes métier, techniques et les personnes concernées par le changement.
        axes: [deplacer_sa_contribution]
      - id: c
        texte: Profiter des échanges pour enquêter sur un métier extérieur à mon domaine technique.
        axes: [changer_de_marche]
      - id: d
        texte: Formuler avec d'autres des demandes communes sur les conditions d'utilisation de l'IA.
        axes: [agir_collectivement]

  - id: q13
    type: situation
    texte: Vous envisagez votre prochain poste dans votre domaine technique actuel. Quelle possibilité attire le plus votre attention ?
    options:
      - id: a
        texte: Un poste proche de mon métier actuel, dont je maîtrise déjà les responsabilités.
        axes: [maintenir_le_cap]
      - id: b
        texte: Un poste où l'IA me permettrait de prendre en charge davantage de projets.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Un poste où une expertise technique pointue que j'ai développée est recherchée.
        axes: [se_differencier_techniquement, maintenir_le_cap]
      - id: d
        texte: Un poste davantage centré sur le métier, la coordination ou la transmission.
        axes: [deplacer_sa_contribution]

  - id: q14
    type: situation
    texte: Un changement dans votre activité vous amène à réexaminer vos options professionnelles. Quelle première piste exploreriez-vous ?
    options:
      - id: a
        texte: Ajuster ma pratique pour rester dans le même type de rôle.
        axes: [maintenir_le_cap]
      - id: b
        texte: Utiliser l'IA pour élargir les tâches que je peux prendre en charge et transmettre cette pratique.
        axes: [accroitre_sa_capacite, deplacer_sa_contribution]
      - id: c
        texte: Vérifier les débouchés d'un autre métier et préparer une transition.
        axes: [changer_de_marche]
      - id: d
        texte: Organiser une réponse collective sur les emplois et les conditions de travail.
        axes: [agir_collectivement]

  - id: q15
    type: situation
    texte: Vous pouvez essayer une activité en parallèle de votre travail pendant un trimestre. Laquelle choisissez-vous ?
    options:
      - id: a
        texte: Fiabiliser un livrable technique produit avec l'IA, qu'il s'agisse de code, de données ou d'un modèle.
        axes: [se_differencier_techniquement]
      - id: b
        texte: Accompagner une équipe pour mieux définir ses besoins avant de construire.
        axes: [deplacer_sa_contribution]
      - id: c
        texte: Faire une immersion dans un métier hors de mon domaine technique.
        axes: [changer_de_marche]
      - id: d
        texte: Contribuer à un collectif qui négocie des conditions de travail.
        axes: [agir_collectivement]
