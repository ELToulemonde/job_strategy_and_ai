version: 4
titre: Quelles orientations professionnelles dans un contexte d'IA ?
consigne: Répondez en pensant aux six prochains mois. Plusieurs stratégies peuvent compter à la fois. Il n'y a pas de bonne réponse.
duree_estimee: 4 à 5 minutes
strategies_source: strategies-ia-emploi-dev.yaml
axes:
  - maintenir_le_cap
  - accroitre_sa_capacite
  - se_differencier_techniquement
  - deplacer_sa_contribution
  - changer_de_marche
  - agir_collectivement

affirmations:
  echelle:
    - {valeur: 1, libelle: "1"}
    - {valeur: 2, libelle: "2"}
    - {valeur: 3, libelle: "3"}
    - {valeur: 4, libelle: "4"}
    - {valeur: 5, libelle: "5"}
  borne_basse: Pas du tout une priorité
  borne_haute: Priorité très forte
  reponse_incertaine: Je ne sais pas encore

situations:
  maximum_choix: 1
  consigne: Choisissez la piste que vous privilégieriez. « Aucune » et « Je ne sais pas encore » sont aussi possibles.
  reponses_speciales:
    aucune:
      libelle: Aucune de ces pistes ne convient
      contribution: 0
      exclusive: true
    incertain:
      libelle: Je ne sais pas encore
      contribution: null
      exclusive: true

calcul:
  poids_affirmation: 0.5
  poids_situations: 0.5
  points_par_option_et_axe: 1
  plafond_par_situation_et_axe: 1
  valeur_manquante: null
  arrondi_affichage_decimales: 1

questions:
  - id: q01
    type: affirmation
    axe: maintenir_le_cap
    texte: Continuer dans le type de rôle actuel, sans réorientation majeure, est une priorité.

  - id: q02
    type: affirmation
    axe: accroitre_sa_capacite
    texte: Utiliser l'IA pour élargir ce qui peut être réalisé professionnellement est une priorité.

  - id: q03
    type: affirmation
    axe: se_differencier_techniquement
    texte: Se distinguer par la qualité et la fiabilité de ce qui est produit (visuels, textes, code ou données) est une priorité.

  - id: q04
    type: affirmation
    axe: deplacer_sa_contribution
    texte: Accorder plus de place au choix des problèmes, à la coordination ou à la transmission qu'à la production directe est une priorité.

  - id: q05
    type: affirmation
    axe: changer_de_marche
    texte: Préparer une transition vers un autre métier ou secteur est une priorité.

  - id: q06
    type: affirmation
    axe: agir_collectivement
    texte: Agir avec d'autres personnes sur les conditions de travail liées à l'IA est une priorité.

  - id: q07
    type: situation
    texte: Vous pouvez réserver une demi-journée par semaine à votre avenir professionnel. À quoi la consacrez-vous ?
    options:
      - id: a
        texte: Consolider la pratique actuelle et vérifier qu'elle répond toujours aux attentes du marché.
        axes: [maintenir_le_cap]
      - id: b
        texte: Tester un usage de l'IA qui permettrait de prendre en charge de nouveaux travaux.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Approfondir la résolution d'un problème difficile dans le métier actuel, avec l'IA si elle aide.
        axes: [se_differencier_techniquement, accroitre_sa_capacite]
      - id: d
        texte: Discuter avec des utilisateurs pour comprendre quels problèmes résoudre.
        axes: [deplacer_sa_contribution]

  - id: q08
    type: situation
    texte: Vous choisissez un projet personnel pour les prochains mois. Lequel privilégiez-vous ?
    options:
      - id: a
        texte: Mettre à jour et approfondir un savoir-faire exigeant utile au rôle actuel.
        axes: [maintenir_le_cap, se_differencier_techniquement]
      - id: b
        texte: Construire avec l'IA quelque chose qui ne pourrait pas être réalisé sans elle aujourd'hui.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Tester une activité dans un autre métier.
        axes: [changer_de_marche]
      - id: d
        texte: Préparer avec des collègues des propositions sur les conditions de déploiement de l'IA.
        axes: [agir_collectivement]

  - id: q09
    type: situation
    texte: Votre équipe envisage d'utiliser davantage l'IA dans son travail. Que feriez-vous en premier ?
    options:
      - id: a
        texte: Vérifier la fiabilité du travail produit avec l'IA dans le rôle actuel.
        axes: [se_differencier_techniquement, maintenir_le_cap]
      - id: b
        texte: Tester les usages utiles, puis aider l'équipe à les mettre en place.
        axes: [deplacer_sa_contribution, accroitre_sa_capacite]
      - id: c
        texte: Explorer les possibilités dans un autre métier ou secteur.
        axes: [changer_de_marche]
      - id: d
        texte: Discuter avec les collègues pour négocier les règles d'usage et la charge de travail.
        axes: [agir_collectivement]

  - id: q10
    type: situation
    texte: Vous recevez une proposition d'emploi ou de prestation proche de votre activité actuelle. Qu'est-ce qui vous donnerait envie de l'accepter ?
    options:
      - id: a
        texte: Poursuivre l'activité actuelle dans un cadre connu.
        axes: [maintenir_le_cap]
      - id: b
        texte: Élargir les tâches prises en charge grâce à l'IA.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Résoudre des problèmes difficiles et vérifier la qualité du travail produit.
        axes: [se_differencier_techniquement]
      - id: d
        texte: Définir les besoins et décider du travail à réaliser.
        axes: [deplacer_sa_contribution]

  - id: q11
    type: situation
    texte: Vous avez une journée de formation à utiliser librement. Quel apprentissage choisiriez-vous ?
    options:
      - id: a
        texte: Apprendre à repérer et corriger les défauts dans les réalisations du métier actuel.
        axes: [maintenir_le_cap, se_differencier_techniquement]
      - id: b
        texte: Apprendre à utiliser l'IA pour aider les collègues à élargir ce qu'ils peuvent réaliser.
        axes: [accroitre_sa_capacite, deplacer_sa_contribution]
      - id: c
        texte: Découvrir les compétences nécessaires pour exercer un autre métier.
        axes: [changer_de_marche]
      - id: d
        texte: Apprendre à organiser une négociation collective sur les effets de l'IA au travail.
        axes: [agir_collectivement]

  - id: q12
    type: situation
    texte: Un réseau professionnel organise des échanges sur l'évolution des métiers avec l'IA. Quel sujet souhaiteriez-vous voir abordé en priorité ?
    options:
      - id: a
        texte: La qualité et la fiabilité du travail produit avec l'IA, et les moyens de les vérifier.
        axes: [se_differencier_techniquement]
      - id: b
        texte: Le choix des problèmes à traiter et la coordination entre les personnes concernées.
        axes: [deplacer_sa_contribution]
      - id: c
        texte: Les possibilités de transition vers un autre métier ou secteur.
        axes: [changer_de_marche]
      - id: d
        texte: Les conditions de travail liées à l'IA et leur négociation collective.
        axes: [agir_collectivement]

  - id: q13
    type: situation
    texte: Vous pouvez conserver ou faire évoluer votre rôle actuel. Quelle option privilégieriez-vous ?
    options:
      - id: a
        texte: Continuer à exercer les responsabilités déjà maîtrisées.
        axes: [maintenir_le_cap]
      - id: b
        texte: Prendre en charge davantage de projets grâce à l'IA.
        axes: [accroitre_sa_capacite]
      - id: c
        texte: Assumer la responsabilité des travaux les plus difficiles du métier actuel.
        axes: [se_differencier_techniquement, maintenir_le_cap]
      - id: d
        texte: Choisir les problèmes à traiter et coordonner leur résolution.
        axes: [deplacer_sa_contribution]

  - id: q14
    type: situation
    texte: Les demandes pour votre travail habituel diminuent. Quelle première piste exploreriez-vous ?
    options:
      - id: a
        texte: Ajuster la pratique pour rester dans le même type de rôle.
        axes: [maintenir_le_cap]
      - id: b
        texte: Tester avec une équipe de nouvelles tâches réalisables avec l'IA, puis lui transmettre la méthode.
        axes: [accroitre_sa_capacite, deplacer_sa_contribution]
      - id: c
        texte: Vérifier les débouchés d'un autre métier et préparer une transition.
        axes: [changer_de_marche]
      - id: d
        texte: Organiser une réponse collective sur les emplois et les conditions de travail.
        axes: [agir_collectivement]

  - id: q15
    type: situation
    texte: Vous pouvez essayer une activité en parallèle de votre travail pendant un trimestre. Laquelle choisissez-vous ?
    options:
      - id: a
        texte: Fiabiliser une réalisation produite avec l'IA et montrer comment sa qualité est vérifiée.
        axes: [se_differencier_techniquement]
      - id: b
        texte: Accompagner une équipe pour mieux définir ses besoins avant de construire.
        axes: [deplacer_sa_contribution]
      - id: c
        texte: Faire une immersion dans un autre métier ou secteur.
        axes: [changer_de_marche]
      - id: d
        texte: Contribuer à un collectif qui négocie des conditions de travail.
        axes: [agir_collectivement]
